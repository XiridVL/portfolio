name: CI

# Quality gate for every push and pull request. Render deploys the main branch
# only after these checks pass (render.yaml: autoDeployTrigger: checksPass).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseded pull-request runs can stop early; main always finishes.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Type check, compliance and Lighthouse
    runs-on: ubuntu-latest
    env:
      # Lighthouse serves dist/ from the server root, so this build always uses '/'.
      BASE_PATH: /
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Type check
        run: npm run check
      - name: Build
        run: npm run build
      - name: Compliance check (spec §17)
        run: npm run check:compliance
      - name: Link check
        run: npm run check:links
      - name: Lighthouse budgets
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./.github/lighthouse/lighthouserc.json
          uploadArtifacts: true
